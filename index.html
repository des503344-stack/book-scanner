<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>북 스캔 스튜디오 (모바일 단독 테스트)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
    }
    .top-bar {
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
      padding: 10px 12px; background: rgba(18, 18, 18, 0.95); z-index: 10;
    }
    .title-badge {
      font-size: 13px; font-weight: bold; color: #93c5fd; white-space: nowrap;
    }
    .top-actions { display: flex; gap: 6px; }
    .mode-btn, .auto-btn {
      background: #262626; color: #fff; border: 1px solid #444;
      border-radius: 8px; padding: 7px 10px; font-size: 12px; font-weight: bold; cursor: pointer;
    }
    .mode-btn { background: #2563eb; border-color: #3b82f6; }
    .auto-btn.active { background: #10b981; border-color: #34d399; color: #000; }

    .auto-control-bar {
      background: rgba(24, 24, 27, 0.95); border-bottom: 1px solid #333;
      padding: 8px 14px; display: flex; flex-direction: column; gap: 6px; z-index: 10;
    }
    .auto-status-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .auto-badge {
      font-size: 12px; font-weight: bold; padding: 4px 10px; border-radius: 12px;
      background: #333; color: #e5e7eb;
    }
    .auto-badge.waiting { background: #1e3a8a; color: #93c5fd; }
    .auto-badge.moving { background: #78350f; color: #fcd34d; }
    .auto-badge.stabilizing { background: #065f46; color: #6ee7b7; }
    .auto-badge.paused { background: #4b5563; color: #d1d5db; }
    .pause-btn {
      background: #374151; color: #fff; border: 1px solid #4b5563;
      border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer;
    }
    .auto-slider-row { display: flex; align-items: center; gap: 10px; font-size: 12px; color: #aaa; }
    .auto-slider-row input[type="range"] { flex: 1; accent-color: #10b981; }

    .camera-container {
      position: relative; flex: 1; background: #000; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    #video { width: 100%; height: 100%; object-fit: cover; }

    .guide-overlay {
      position: absolute; inset: 0; pointer-events: none;
      display: flex; align-items: center; justify-content: center; padding: 5%;
    }
    .guide-frame {
      width: 100%; height: 100%; border: 2px dashed rgba(255, 255, 255, 0.7);
      border-radius: 8px; position: relative; transition: border-color 0.2s;
    }
    .guide-frame.ready-border { border-color: #10b981; border-style: solid; }
    .guide-frame.moving-border { border-color: #f59e0b; }

    .center-line {
      position: absolute; top: 0; bottom: 0; left: 50%; width: 2px;
      background: rgba(59, 130, 246, 0.85); transform: translateX(-50%);
    }
    .guide-overlay.mode-1p .center-line { display: none; }

    .flash-effect {
      position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none;
      transition: opacity 0.15s ease-out;
    }
    .flash-effect.active { opacity: 0.7; }

    .status-toast {
      position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.82); color: #fff; padding: 8px 14px;
      border-radius: 20px; font-size: 12px; white-space: nowrap;
      opacity: 0; transition: opacity 0.25s; pointer-events: none;
    }
    .status-toast.show { opacity: 1; }

    .bottom-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 24px 24px; background: rgba(18, 18, 18, 0.95); z-index: 10;
    }
    .thumb-box {
      width: 56px; height: 56px; background: #262626; border: 2px solid #555;
      border-radius: 10px; position: relative; overflow: hidden;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .thumb-box img { width: 100%; height: 100%; object-fit: cover; }
    #pageCount {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: rgba(0, 0, 0, 0.75); font-size: 11px; text-align: center; padding: 2px 0;
    }
    .shutter-btn {
      width: 72px; height: 72px; border-radius: 50%; background: #fff;
      border: 5px solid #888; cursor: pointer; transition: transform 0.1s;
    }
    .shutter-btn:active { transform: scale(0.92); background: #ddd; }
    .right-controls { width: 56px; display: flex; justify-content: flex-end; }
    .test-tag { font-size: 11px; color: #10b981; font-weight: bold; }

    .modal {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.96);
      z-index: 100; display: flex; flex-direction: column;
    }
    .modal-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 18px; border-bottom: 1px solid #333; font-weight: bold;
    }
    .close-btn { background: none; border: none; color: #fff; font-size: 22px; cursor: pointer; }
    .modal-body {
      flex: 1; overflow-y: auto; padding: 14px;
      display: flex; flex-direction: column; gap: 14px; align-items: center;
    }
    .preview-card { width: 100%; max-width: 500px; text-align: center; }
    .preview-card img { width: 100%; border-radius: 6px; border: 1px solid #444; margin-bottom: 6px; }
    .preview-card span { font-size: 12px; color: #9ca3af; }
    .modal-footer { display: flex; gap: 10px; padding: 14px; border-top: 1px solid #333; }
    .modal-footer button {
      flex: 1; padding: 13px; border: none; border-radius: 10px; font-size: 14px; font-weight: bold; cursor: pointer;
    }
    .danger-btn { background: #dc2626; color: #fff; }
    .primary-btn { background: #2563eb; color: #fff; }
  </style>
</head>
<body>
  <header class="top-bar">
    <div class="title-badge">📚 카메라·자동촬영 테스트</div>
    <div class="top-actions">
      <button id="autoToggleBtn" class="auto-btn">자동 OFF</button>
      <button id="modeBtn" class="mode-btn">2P 양면</button>
    </div>
  </header>

  <div id="autoControlBar" class="auto-control-bar" style="display:none;">
    <div class="auto-status-row">
      <span id="autoStateBadge" class="auto-badge waiting">책장을 넘기면 자동 촬영됩니다</span>
      <button id="autoPauseBtn" class="pause-btn">일시정지</button>
    </div>
    <div class="auto-slider-row">
      <label for="sensitivitySlider">민감도</label>
      <input type="range" id="sensitivitySlider" min="1" max="10" value="5">
      <span id="sensitivityVal">5</span>
    </div>
  </div>

  <main class="camera-container">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="captureCanvas" style="display:none;"></canvas>

    <div id="guideOverlay" class="guide-overlay mode-2p">
      <div class="guide-frame">
        <div class="center-line"></div>
      </div>
    </div>

    <div id="flashEffect" class="flash-effect"></div>
    <div id="statusToast" class="status-toast">카메라 준비 중...</div>
  </main>

  <footer class="bottom-bar">
    <div id="thumbBox" class="thumb-box" title="찍은 사진 확인">
      <img id="lastThumb" src="" alt="" style="display:none;">
      <span id="pageCount">0쪽</span>
    </div>

    <button id="shutterBtn" class="shutter-btn" aria-label="촬영"></button>

    <div class="right-controls">
      <span class="test-tag">단독모드</span>
    </div>
  </footer>

  <div id="previewModal" class="modal" style="display:none;">
    <div class="modal-header">
      <span>방금 찍은 분할 결과 확인</span>
      <button id="closeModalBtn" class="close-btn">✕</button>
    </div>
    <div id="previewImages" class="modal-body"></div>
    <div class="modal-footer">
      <button id="deleteLastBtn" class="danger-btn">방금 찍은 사진 삭제</button>
      <button id="okModalBtn" class="primary-btn">계속 촬영</button>
    </div>
  </div>

  <script>
    class AutoCaptureEngine {
      constructor(videoEl, onTrigger, onStateChange) {
        this.video = videoEl;
        this.onTrigger = onTrigger;
        this.onStateChange = onStateChange;
        this.enabled = false;
        this.paused = false;
        this.state = "WAITING";
        this.canvas = document.createElement("canvas");
        this.canvas.width = 160;
        this.canvas.height = 120;
        this.ctx = this.canvas.getContext("2d", { willReadFrequently: true });
        this.prevFrame = null;
        this.stableStartTime = 0;
        this.cooldownUntil = 0;
        this.timerId = null;
        this.sensitivity = 5;
      }
      setSensitivity(level) { this.sensitivity = Number(level); }
      getThresholds() {
        const moveThreshold = 22 - this.sensitivity * 1.4;
        const stillThreshold = Math.max(2.5, moveThreshold * 0.35);
        return { moveThreshold, stillThreshold };
      }
      start() {
        if (this.enabled) return;
        this.enabled = true; this.paused = false; this.state = "WAITING"; this.prevFrame = null;
        this.notify("WAITING", "책장을 넘기면 자동 촬영됩니다");
        this.timerId = setInterval(() => this.analyze(), 150);
      }
      stop() {
        this.enabled = false; this.paused = false;
        if (this.timerId) { clearInterval(this.timerId); this.timerId = null; }
        this.prevFrame = null; this.state = "WAITING";
      }
      togglePause() {
        this.paused = !this.paused;
        if (this.paused) {
          this.notify("PAUSED", "자동 촬영 일시정지됨");
        } else {
          this.state = "WAITING"; this.prevFrame = null;
          this.notify("WAITING", "책장을 넘기면 자동 촬영됩니다");
        }
        return this.paused;
      }
      notify(code, msg) { if (this.onStateChange) this.onStateChange(code, msg); }
      captureGray() {
        if (this.video.readyState < 2 || this.video.videoWidth === 0) return null;
        this.ctx.drawImage(this.video, 0, 0, 160, 120);
        const data = this.ctx.getImageData(0, 0, 160, 120).data;
        const gray = new Uint8Array(160 * 120);
        for (let i = 0, j = 0; i < data.length; i += 4, j++) {
          gray[j] = (data[i] * 77 + data[i + 1] * 150 + data[i + 2] * 29) >> 8;
        }
        return gray;
      }
      motion(a, b) {
        let s = 0;
        for (let i = 0; i < a.length; i++) s += Math.abs(a[i] - b[i]);
        return s / a.length;
      }
      sharpness(gray) {
        let sum = 0, cnt = 0;
        for (let y = 1; y < 119; y += 2) {
          for (let x = 1; x < 159; x += 2) {
            const i = y * 160 + x;
            sum += Math.abs(4 * gray[i] - gray[i - 1] - gray[i + 1] - gray[i - 160] - gray[i + 160]);
            cnt++;
          }
        }
        return sum / cnt;
      }
      analyze() {
        if (!this.enabled || this.paused) return;
        const now = Date.now();
        if (now < this.cooldownUntil) return;
        const cur = this.captureGray();
        if (!cur) return;
        if (!this.prevFrame) { this.prevFrame = cur; return; }
        const m = this.motion(this.prevFrame, cur);
        const { moveThreshold, stillThreshold } = this.getThresholds();
        this.prevFrame = cur;

        if (this.state === "WAITING") {
          if (m >= moveThreshold) {
            this.state = "MOVING";
            this.notify("MOVING", "책장 넘김 감지됨... 손을 치워주세요");
          }
        } else if (this.state === "MOVING") {
          if (m <= stillThreshold) {
            this.state = "STABILIZING";
            this.stableStartTime = now;
            this.notify("STABILIZING", "초점 안정화 중... 곧 촬영됩니다");
          }
        } else if (this.state === "STABILIZING") {
          if (m > stillThreshold * 1.5) {
            this.state = "MOVING";
            this.notify("MOVING", "움직임 감지됨... 잠시 멈춰주세요");
          } else if (now - this.stableStartTime >= 600) {
            if (this.sharpness(cur) >= 3.0) {
              this.state = "WAITING";
              this.cooldownUntil = now + 1500;
              this.notify("WAITING", "📸 자동 촬영 완료! 다음 장을 넘겨주세요");
              if (this.onTrigger) this.onTrigger();
            }
          }
        }
      }
    }

    const video = document.getElementById("video");
    const captureCanvas = document.getElementById("captureCanvas");
    const modeBtn = document.getElementById("modeBtn");
    const autoToggleBtn = document.getElementById("autoToggleBtn");
    const autoControlBar = document.getElementById("autoControlBar");
    const autoStateBadge = document.getElementById("autoStateBadge");
    const autoPauseBtn = document.getElementById("autoPauseBtn");
    const sensitivitySlider = document.getElementById("sensitivitySlider");
    const sensitivityVal = document.getElementById("sensitivityVal");
    const guideOverlay = document.getElementById("guideOverlay");
    const guideFrame = document.querySelector(".guide-frame");
    const shutterBtn = document.getElementById("shutterBtn");
    const flashEffect = document.getElementById("flashEffect");
    const statusToast = document.getElementById("statusToast");
    const thumbBox = document.getElementById("thumbBox");
    const lastThumb = document.getElementById("lastThumb");
    const pageCount = document.getElementById("pageCount");
    const previewModal = document.getElementById("previewModal");
    const previewImages = document.getElementById("previewImages");
    const closeModalBtn = document.getElementById("closeModalBtn");
    const okModalBtn = document.getElementById("okModalBtn");
    const deleteLastBtn = document.getElementById("deleteLastBtn");

    let scanMode = "2p";
    let capturedPages = [];
    let lastBatchCount = 0;
    let audioCtx = null;

    function playShutterSound() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.09);
      } catch (e) {}
    }

    function showToast(msg, ms = 2200) {
      statusToast.textContent = msg;
      statusToast.classList.add("show");
      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => statusToast.classList.remove("show"), ms);
    }

    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 2560 }, height: { ideal: 1920 } },
          audio: false
        });
        video.srcObject = stream;
        showToast("✅ 카메라 준비 완료!");
      } catch (err) {
        alert("카메라 권한을 허용해주세요: " + err.message);
      }
    }

    function captureLocal() {
      if (!video.videoWidth) return;
      playShutterSound();
      flashEffect.classList.add("active");
      setTimeout(() => flashEffect.classList.remove("active"), 150);

      const vw = video.videoWidth;
      const vh = video.videoHeight;

      if (scanMode === "2p") {
        // 좌/우 반으로 분할하여 미리보기 저장
        const half = Math.floor(vw / 2);
        const leftCanvas = document.createElement("canvas");
        leftCanvas.width = half; leftCanvas.height = vh;
        leftCanvas.getContext("2d").drawImage(video, 0, 0, half, vh, 0, 0, half, vh);

        const rightCanvas = document.createElement("canvas");
        rightCanvas.width = vw - half; rightCanvas.height = vh;
        rightCanvas.getContext("2d").drawImage(video, half, 0, vw - half, vh, 0, 0, vw - half, vh);

        capturedPages.push(leftCanvas.toDataURL("image/jpeg", 0.85));
        capturedPages.push(rightCanvas.toDataURL("image/jpeg", 0.85));
        lastBatchCount = 2;
      } else {
        captureCanvas.width = vw; captureCanvas.height = vh;
        captureCanvas.getContext("2d").drawImage(video, 0, 0);
        capturedPages.push(captureCanvas.toDataURL("image/jpeg", 0.85));
        lastBatchCount = 1;
      }

      updateThumb();
      showToast(`📸 촬영 완료! (누적 ${capturedPages.length}쪽)`);
    }

    function updateThumb() {
      pageCount.textContent = `${capturedPages.length}쪽`;
      if (capturedPages.length > 0) {
        lastThumb.src = capturedPages[capturedPages.length - 1];
        lastThumb.style.display = "block";
      } else {
        lastThumb.style.display = "none";
      }
    }

    const autoEngine = new AutoCaptureEngine(
      video,
      () => { if (previewModal.style.display === "none") captureLocal(); },
      (code, msg) => {
        autoStateBadge.textContent = msg;
        autoStateBadge.className = "auto-badge " + code.toLowerCase();
        guideFrame.classList.remove("ready-border", "moving-border");
        if (code === "MOVING") guideFrame.classList.add("moving-border");
        else if (code === "STABILIZING") guideFrame.classList.add("ready-border");
      }
    );

    autoToggleBtn.addEventListener("click", () => {
      if (autoEngine.enabled) {
        autoEngine.stop();
        autoToggleBtn.textContent = "자동 OFF";
        autoToggleBtn.classList.remove("active");
        autoControlBar.style.display = "none";
        guideFrame.classList.remove("ready-border", "moving-border");
      } else {
        autoEngine.start();
        autoToggleBtn.textContent = "자동 ON";
        autoToggleBtn.classList.add("active");
        autoControlBar.style.display = "flex";
        autoPauseBtn.textContent = "일시정지";
        showToast("자동 촬영 ON! 책장을 넘겨보세요");
      }
    });

    autoPauseBtn.addEventListener("click", () => {
      const p = autoEngine.togglePause();
      autoPauseBtn.textContent = p ? "다시 시작" : "일시정지";
    });

    sensitivitySlider.addEventListener("input", () => {
      sensitivityVal.textContent = sensitivitySlider.value;
      autoEngine.setSensitivity(sensitivitySlider.value);
    });

    modeBtn.addEventListener("click", () => {
      if (scanMode === "2p") {
        scanMode = "1p"; modeBtn.textContent = "1P 단면";
        guideOverlay.classList.replace("mode-2p", "mode-1p");
      } else {
        scanMode = "2p"; modeBtn.textContent = "2P 양면";
        guideOverlay.classList.replace("mode-1p", "mode-2p");
      }
    });

    shutterBtn.addEventListener("click", captureLocal);

    thumbBox.addEventListener("click", () => {
      if (capturedPages.length === 0) { showToast("촬영한 사진이 없습니다."); return; }
      previewImages.innerHTML = "";
      const recent = capturedPages.slice(-lastBatchCount);
      recent.forEach((src, idx) => {
        const card = document.createElement("div");
        card.className = "preview-card";
        card.innerHTML = `<img src="${src}"><span>${capturedPages.length - recent.length + idx + 1} 페이지</span>`;
        previewImages.appendChild(card);
      });
      previewModal.style.display = "flex";
    });

    const closeModal = () => { previewModal.style.display = "none"; };
    closeModalBtn.addEventListener("click", closeModal);
    okModalBtn.addEventListener("click", closeModal);

    deleteLastBtn.addEventListener("click", () => {
      if (lastBatchCount > 0) {
        capturedPages.splice(-lastBatchCount);
        lastBatchCount = 0;
        updateThumb();
        closeModal();
        showToast("🗑 방금 찍은 사진을 삭제했습니다.");
      }
    });

    initCamera();
  </script>
</body>
</html>
