<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>북 스캔 스튜디오 v5 (정밀 영역 인식 + 자동 촬영)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      height: 100dvh; display: flex; flex-direction: column; overflow: hidden; user-select: none;
      touch-action: none;
    }

    /* 상단 바 */
    .top-bar {
      display: flex; justify-content: space-between; align-items: center; gap: 6px;
      padding: 8px 10px; background: rgba(15, 15, 18, 0.96); border-bottom: 1px solid #27272a; z-index: 20;
    }
    .brand { font-size: 13px; font-weight: 700; color: #93c5fd; white-space: nowrap; }
    .top-actions { display: flex; gap: 5px; flex-wrap: nowrap; }
    .pill-btn {
      background: #27272a; color: #e4e4e7; border: 1px solid #3f3f46;
      border-radius: 8px; padding: 6px 9px; font-size: 11px; font-weight: 700; cursor: pointer;
      white-space: nowrap; transition: background 0.15s;
    }
    .pill-btn.active-blue { background: #2563eb; border-color: #3b82f6; color: #fff; }
    .pill-btn.active-green { background: #10b981; border-color: #34d399; color: #052e16; }
    .pill-btn.active-amber { background: #f59e0b; border-color: #fbbf24; color: #451a03; }

    /* 상태 & 게이지 바 */
    .status-bar {
      background: rgba(24, 24, 27, 0.94); padding: 6px 12px;
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
      border-bottom: 1px solid #27272a; z-index: 20;
    }
    .status-pill {
      font-size: 11.5px; font-weight: 700; padding: 4px 10px; border-radius: 999px;
      background: #27272a; color: #d4d4d8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .status-pill.loading { background: #312e81; color: #c7d2fe; }
    .status-pill.searching { background: #1e293b; color: #94a3b8; }
    .status-pill.moving { background: #78350f; color: #fde68a; }
    .status-pill.locking { background: #065f46; color: #6ee7b7; }
    .status-pill.cooldown { background: #1e3a8a; color: #93c5fd; }

    .progress-wrap {
      width: 82px; height: 8px; background: #27272a; border-radius: 999px; overflow: hidden; flex-shrink: 0;
    }
    .progress-fill {
      width: 0%; height: 100%; background: #10b981; transition: width 0.08s linear;
    }

    /* 카메라 & 오버레이 영역 */
    .camera-container {
      position: relative; flex: 1; background: #000; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    #video { width: 100%; height: 100%; object-fit: cover; }
    #overlayCanvas {
      position: absolute; inset: 0; width: 100%; height: 100%; z-index: 10;
      touch-action: none;
    }
    .flash-effect {
      position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none;
      transition: opacity 0.14s ease-out; z-index: 15;
    }
    .flash-effect.active { opacity: 0.78; }

    /* OpenCV 로딩 오버레이 */
    .cv-loader {
      position: absolute; inset: 0; background: rgba(0, 0, 0, 0.82);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 12px; z-index: 30; padding: 20px; text-align: center;
    }
    .spinner {
      width: 36px; height: 36px; border: 4px solid #3f3f46; border-top-color: #3b82f6;
      border-radius: 50%; animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader-text { font-size: 13px; color: #e4e4e7; font-weight: 600; }
    .loader-sub { font-size: 11px; color: #a1a1aa; }

    .toast {
      position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.88); color: #fff; padding: 8px 14px;
      border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap;
      opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 25;
      border: 1px solid rgba(255,255,255,0.16);
    }
    .toast.show { opacity: 1; }

    /* 하단 컨트롤 바 */
    .bottom-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 20px 20px; background: rgba(15, 15, 18, 0.96);
      border-top: 1px solid #27272a; z-index: 20;
    }
    .thumb-box {
      width: 56px; height: 56px; background: #18181b; border: 2px solid #52525b;
      border-radius: 10px; position: relative; overflow: hidden;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .thumb-box img { width: 100%; height: 100%; object-fit: cover; }
    #pageCount {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: rgba(0, 0, 0, 0.78); font-size: 11px; font-weight: 700; text-align: center; padding: 2px 0;
    }

    .shutter-btn {
      width: 66px; height: 66px; border-radius: 50%; background: #fff;
      border: 5px solid #71717a; cursor: pointer; transition: transform 0.1s;
    }
    .shutter-btn:active { transform: scale(0.92); background: #d4d4d8; }

    .right-tools {
      width: 60px; display: flex; flex-direction: column; align-items: flex-end; gap: 4px;
    }
    .sub-label { font-size: 10px; color: #a1a1aa; }
    .small-btn {
      background: #27272a; color: #f4f4f5; border: 1px solid #3f3f46;
      border-radius: 6px; padding: 5px 8px; font-size: 11px; font-weight: 700; cursor: pointer;
    }

    /* 미리보기 모달 */
    .modal {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.96);
      z-index: 100; display: flex; flex-direction: column;
    }
    .modal-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 18px; border-bottom: 1px solid #27272a; font-weight: 700; font-size: 15px;
    }
    .close-btn { background: none; border: none; color: #fff; font-size: 22px; cursor: pointer; }
    .modal-body {
      flex: 1; overflow-y: auto; padding: 14px;
      display: flex; flex-direction: column; gap: 14px; align-items: center;
    }
    .preview-card { width: 100%; max-width: 520px; text-align: center; }
    .preview-card img { width: 100%; border-radius: 8px; border: 1px solid #3f3f46; margin-bottom: 6px; }
    .preview-card span { font-size: 12px; color: #a1a1aa; }
    .modal-footer { display: flex; gap: 10px; padding: 14px; border-top: 1px solid #27272a; }
    .modal-footer button {
      flex: 1; padding: 13px; border: none; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer;
    }
    .danger-btn { background: #dc2626; color: #fff; }
    .primary-btn { background: #2563eb; color: #fff; }
  </style>
</head>
<body>
  <header class="top-bar">
    <div class="brand">📐 스캔 v5</div>
    <div class="top-actions">
      <button id="lockBtn" class="pill-btn">🔓 영역고정</button>
      <button id="autoScanBtn" class="pill-btn active-green">자동 ON</button>
      <button id="modeBtn" class="pill-btn active-blue">2P</button>
    </div>
  </header>

  <div class="status-bar">
    <span id="statusPill" class="status-pill loading">OpenCV 엔진 로딩 중...</span>
    <div class="progress-wrap">
      <div id="progressFill" class="progress-fill"></div>
    </div>
  </div>

  <main class="camera-container">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlayCanvas"></canvas>
    <div id="flashEffect" class="flash-effect"></div>

    <div id="cvLoader" class="cv-loader">
      <div class="spinner"></div>
      <div class="loader-text">OpenCV.js 스캔 엔진 불러오는 중...</div>
      <div class="loader-sub">최초 1회 약 3~5초 소요됩니다</div>
    </div>

    <div id="toast" class="toast">준비 중...</div>
  </main>

  <footer class="bottom-bar">
    <div id="thumbBox" class="thumb-box" title="촬영 결과 확인">
      <img id="lastThumb" src="" alt="" style="display:none;">
      <span id="pageCount">0쪽</span>
    </div>

    <button id="shutterBtn" class="shutter-btn" aria-label="수동 촬영"></button>

    <div class="right-tools">
      <span class="sub-label">안전여백</span>
      <button id="padBtn" class="small-btn">2% ON</button>
    </div>
  </footer>

  <div id="previewModal" class="modal" style="display:none;">
    <div class="modal-header">
      <span>원근 보정 · 분할 결과 확인</span>
      <button id="closeModalBtn" class="close-btn">✕</button>
    </div>
    <div id="previewImages" class="modal-body"></div>
    <div class="modal-footer">
      <button id="deleteLastBtn" class="danger-btn">방금 찍은 사진 삭제</button>
      <button id="okModalBtn" class="primary-btn">계속 촬영</button>
    </div>
  </div>

  <!-- OpenCV.js CDN -->
  <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvLoaded()" onerror="onOpenCvError()"></script>

  <script>
    const video = document.getElementById("video");
    const overlayCanvas = document.getElementById("overlayCanvas");
    const overlayCtx = overlayCanvas.getContext("2d");
    const cvLoader = document.getElementById("cvLoader");

    const lockBtn = document.getElementById("lockBtn");
    const autoScanBtn = document.getElementById("autoScanBtn");
    const modeBtn = document.getElementById("modeBtn");
    const padBtn = document.getElementById("padBtn");
    const statusPill = document.getElementById("statusPill");
    const progressFill = document.getElementById("progressFill");
    const flashEffect = document.getElementById("flashEffect");
    const toast = document.getElementById("toast");
    const thumbBox = document.getElementById("thumbBox");
    const lastThumb = document.getElementById("lastThumb");
    const pageCount = document.getElementById("pageCount");
    const shutterBtn = document.getElementById("shutterBtn");

    const previewModal = document.getElementById("previewModal");
    const previewImages = document.getElementById("previewImages");
    const closeModalBtn = document.getElementById("closeModalBtn");
    const okModalBtn = document.getElementById("okModalBtn");
    const deleteLastBtn = document.getElementById("deleteLastBtn");

    // 분석용 경량 캔버스
    const workCanvas = document.createElement("canvas");
    const workCtx = workCanvas.getContext("2d", { willReadFrequently: true });
    const WORK_W = 240;
    let WORK_H = 320;

    // 내용 변화/유사도 비교용 초경량 캔버스
    const sigCanvas = document.createElement("canvas");
    sigCanvas.width = 64;
    sigCanvas.height = 64;
    const sigCtx = sigCanvas.getContext("2d", { willReadFrequently: true });

    // 앱 상태
    let cvReady = false;
    let cameraReady = false;
    let autoScanEnabled = true;
    let isLocked = false;         // 영역 고정(Lock) 모드
    let scanMode = "2p";          // "2p" | "1p"
    let safetyPadding = 0.02;     // 2% 안전 여백

    // 네모 좌표 (0~1 비디오 기준 정규화: [tl, tr, br, bl])
    let currentQuad = null;
    let lockedQuad = [
      { x: 0.08, y: 0.12 },
      { x: 0.92, y: 0.12 },
      { x: 0.92, y: 0.88 },
      { x: 0.08, y: 0.88 }
    ];
    let draggingCorner = -1;

    // 3단계 책장 넘김 & 안정화 상태 머신
    let prevSig = null;
    let lastCapturedSig = null;
    let stableStartTime = 0;
    let hasMovedSinceCapture = true;
    let missedFrames = 0;
    let cooldownUntil = 0;

    let capturedPages = [];
    let lastBatchCount = 0;
    let audioCtx = null;
    let wakeLock = null;

    function onOpenCvLoaded() {
      if (typeof cv !== "undefined") {
        if (cv.getBuildInformation) {
          finishCvInit();
        } else {
          cv["onRuntimeInitialized"] = finishCvInit;
        }
      }
    }

    function finishCvInit() {
      cvReady = true;
      cvLoader.style.display = "none";
      setStatus("searching", "책을 비추거나 [영역고정]을 누르세요");
      showToast("✅ OpenCV v5 엔진 준비 완료!");
    }

    function onOpenCvError() {
      cvLoader.innerHTML = '<div class="loader-text">❌ OpenCV 로딩 실패</div><div class="loader-sub">인터넷 연결을 확인하고 새로고침 해주세요</div>';
    }

    async function requestWakeLock() {
      try {
        if ("wakeLock" in navigator) {
          wakeLock = await navigator.wakeLock.request("screen");
        }
      } catch (e) {}
    }
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") requestWakeLock();
    });

    function playShutterSound() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(920, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(460, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.16, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.09);
      } catch (e) {}
    }

    function showToast(msg, ms = 2200) {
      toast.textContent = msg;
      toast.classList.add("show");
      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => toast.classList.remove("show"), ms);
    }

    function setStatus(type, text) {
      statusPill.className = "status-pill " + type;
      statusPill.textContent = text;
    }

    // [버그 수정 1] overlayCanvas 실제 CSS 픽셀 크기를 동기화하여 좌표 어긋남 원천 차단
    function syncOverlaySize() {
      const rect = overlayCanvas.getBoundingClientRect();
      const cw = Math.max(1, Math.round(rect.width));
      const ch = Math.max(1, Math.round(rect.height));
      if (overlayCanvas.width !== cw || overlayCanvas.height !== ch) {
        overlayCanvas.width = cw;
        overlayCanvas.height = ch;
      }
      return { cw, ch };
    }

    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 2560 },
            height: { ideal: 1920 }
          },
          audio: false
        });
        video.srcObject = stream;
        video.onloadedmetadata = () => {
          const aspect = video.videoHeight / video.videoWidth;
          WORK_H = Math.round(WORK_W * aspect);
          workCanvas.width = WORK_W;
          workCanvas.height = WORK_H;
          syncOverlaySize();
          cameraReady = true;
          requestWakeLock();
          requestAnimationFrame(mainLoop);
        };
      } catch (err) {
        alert("카메라 권한을 허용해주세요: " + err.message);
      }
    }

    window.addEventListener("resize", syncOverlaySize);

    function getCoverMetrics() {
      const { cw, ch } = syncOverlaySize();
      const vw = video.videoWidth || 1;
      const vh = video.videoHeight || 1;
      const scale = Math.max(cw / vw, ch / vh);
      const dispW = vw * scale;
      const dispH = vh * scale;
      const offsetX = (cw - dispW) / 2;
      const offsetY = (ch - dispH) / 2;
      return { cw, ch, vw, vh, dispW, dispH, offsetX, offsetY };
    }

    function normToScreen(pt) {
      const m = getCoverMetrics();
      return { x: m.offsetX + pt.x * m.dispW, y: m.offsetY + pt.y * m.dispH };
    }

    function screenToNorm(sx, sy) {
      const m = getCoverMetrics();
      return {
        x: Math.max(0.01, Math.min(0.99, (sx - m.offsetX) / m.dispW)),
        y: Math.max(0.01, Math.min(0.99, (sy - m.offsetY) / m.dispH))
      };
    }

    // [버그 수정 2] 기하학적(각도 기반) 4꼭짓점 정렬 [tl, tr, br, bl] — 극단적 기울기에도 꼬이지 않음
    function orderQuad(pts) {
      if (pts.length !== 4) return pts;
      const cx = pts.reduce((acc, p) => acc + p.x, 0) / 4;
      const cy = pts.reduce((acc, p) => acc + p.y, 0) / 4;

      // 중심 기준 반시계 방향 정렬 후 좌상단(x+y 최소) 시작점으로 회전
      const sorted = pts.slice().sort((a, b) => Math.atan2(a.y - cy, a.x - cx) - Math.atan2(b.y - cy, b.x - cx));
      let tlIdx = 0;
      let minSum = Infinity;
      for (let i = 0; i < 4; i++) {
        const s = sorted[i].x + sorted[i].y;
        if (s < minSum) { minSum = s; tlIdx = i; }
      }
      const rotated = [
        sorted[tlIdx],
        sorted[(tlIdx + 1) % 4],
        sorted[(tlIdx + 2) % 4],
        sorted[(tlIdx + 3) % 4]
      ];
      // 시계 방향 [tl, tr, br, bl] 보장
      const cross = (rotated[1].x - rotated[0].x) * (rotated[2].y - rotated[1].y)
                  - (rotated[1].y - rotated[0].y) * (rotated[2].x - rotated[1].x);
      if (cross < 0) {
        return [rotated[0], rotated[3], rotated[2], rotated[1]];
      }
      return rotated;
    }

    // [인식률 대폭 개선] 다중 전략(Otsu 종이 블록 + Canny 에지) + Convex Hull 극점 fallback
    function extractQuadCandidate(cnt, totalArea) {
      const area = cv.contourArea(cnt);
      if (area < totalArea * 0.14 || area > totalArea * 0.96) return null;

      const peri = cv.arcLength(cnt, true);
      if (peri <= 0) return null;

      // 1순위: 다각형 근사로 4꼭짓점 추출
      for (const eps of [0.02, 0.035, 0.05]) {
        const approx = new cv.Mat();
        cv.approxPolyDP(cnt, approx, eps * peri, true);
        if (approx.rows === 4 && cv.isContourConvex(approx)) {
          const pts = [];
          for (let r = 0; r < 4; r++) {
            pts.push({
              x: approx.intPtr(r, 0)[0] / WORK_W,
              y: approx.intPtr(r, 0)[1] / WORK_H
            });
          }
          approx.delete();
          return orderQuad(pts);
        }
        approx.delete();
      }

      // 2순위: 책 곡면 때문에 꼭짓점이 5개 이상인 경우 Convex Hull 4극점 추출
      const hull = new cv.Mat();
      cv.convexHull(cnt, hull, false, true);
      if (hull.rows >= 4) {
        const hPts = [];
        for (let r = 0; r < hull.rows; r++) {
          hPts.push({
            x: hull.intPtr(r, 0)[0] / WORK_W,
            y: hull.intPtr(r, 0)[1] / WORK_H
          });
        }
        hull.delete();

        let tl = hPts[0], tr = hPts[0], br = hPts[0], bl = hPts[0];
        let minS = Infinity, maxS = -Infinity, minD = Infinity, maxD = -Infinity;
        for (const p of hPts) {
          const s = p.x + p.y;
          const d = p.x - p.y;
          if (s < minS) { minS = s; tl = p; }
          if (s > maxS) { maxS = s; br = p; }
          if (d > maxD) { maxD = d; tr = p; }
          if (d < minD) { minD = d; bl = p; }
        }
        return orderQuad([tl, tr, br, bl]);
      }
      hull.delete();
      return null;
    }

    function detectQuadWithOpenCV() {
      if (!cvReady || !cameraReady) return null;

      workCtx.drawImage(video, 0, 0, WORK_W, WORK_H);
      let src = null, gray = null, blurred = null, thresh = null, closed = null;
      let edges = null, dilated = null, contours = null, hierarchy = null, kClose = null, kDilate = null;

      try {
        src = cv.imread(workCanvas);
        gray = new cv.Mat();
        blurred = new cv.Mat();
        contours = new cv.MatVector();
        hierarchy = new cv.Mat();

        cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
        cv.GaussianBlur(gray, blurred, new cv.Size(5, 5), 0);

        const totalArea = WORK_W * WORK_H;
        let bestQuad = null;
        let bestScore = 0;

        // 전략 A: Otsu 이진화 + 큰 닫힘 커널(글자/책등 그림자를 메워 책 전체를 하나의 흰 영역으로 추출)
        thresh = new cv.Mat();
        closed = new cv.Mat();
        kClose = cv.getStructuringElement(cv.MORPH_RECT, new cv.Size(15, 15));
        cv.threshold(blurred, thresh, 0, 255, cv.THRESH_BINARY + cv.THRESH_OTSU);
        cv.morphologyEx(thresh, closed, cv.MORPH_CLOSE, kClose);
        cv.findContours(closed, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

        for (let i = 0; i < contours.size(); i++) {
          const cnt = contours.get(i);
          const area = cv.contourArea(cnt);
          const quad = extractQuadCandidate(cnt, totalArea);
          if (quad && area > bestScore) {
            bestScore = area;
            bestQuad = quad;
          }
          cnt.delete();
        }

        // 전략 B: 전략 A에서 못 찾으면 Canny 에지 팽창으로 재탐색
        if (!bestQuad) {
          edges = new cv.Mat();
          dilated = new cv.Mat();
          kDilate = cv.getStructuringElement(cv.MORPH_RECT, new cv.Size(5, 5));
          cv.Canny(blurred, edges, 35, 110);
          cv.dilate(edges, dilated, kDilate, new cv.Point(-1, -1), 2);
          cv.findContours(dilated, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

          for (let i = 0; i < contours.size(); i++) {
            const cnt = contours.get(i);
            const area = cv.contourArea(cnt);
            const quad = extractQuadCandidate(cnt, totalArea);
            if (quad && area > bestScore) {
              bestScore = area;
              bestQuad = quad;
            }
            cnt.delete();
          }
        }

        return bestQuad;
      } catch (e) {
        return null;
      } finally {
        if (src) src.delete();
        if (gray) gray.delete();
        if (blurred) blurred.delete();
        if (thresh) thresh.delete();
        if (closed) closed.delete();
        if (edges) edges.delete();
        if (dilated) dilated.delete();
        if (contours) contours.delete();
        if (hierarchy) hierarchy.delete();
        if (kClose) kClose.delete();
        if (kDilate) kDilate.delete();
      }
    }

    function extractInsideSignature(quad) {
      const vw = video.videoWidth;
      const vh = video.videoHeight;
      const xs = quad.map(p => p.x * vw);
      const ys = quad.map(p => p.y * vh);
      const sx = Math.max(0, Math.floor(Math.min(...xs)));
      const sy = Math.max(0, Math.floor(Math.min(...ys)));
      const sw = Math.max(32, Math.floor(Math.max(...xs) - sx));
      const sh = Math.max(32, Math.floor(Math.max(...ys) - sy));

      sigCtx.drawImage(video, sx, sy, sw, sh, 0, 0, 64, 64);
      const data = sigCtx.getImageData(0, 0, 64, 64).data;
      const gray = new Uint8Array(64 * 64);
      for (let i = 0, j = 0; i < data.length; i += 4, j++) {
        gray[j] = (data[i] * 77 + data[i + 1] * 150 + data[i + 2] * 29) >> 8;
      }

      let sharp = 0, cnt = 0;
      for (let y = 1; y < 63; y += 2) {
        for (let x = 1; x < 63; x += 2) {
          const i = y * 64 + x;
          sharp += Math.abs(4 * gray[i] - gray[i - 1] - gray[i + 1] - gray[i - 64] - gray[i + 64]);
          cnt++;
        }
      }
      return { gray, sharpness: sharp / cnt };
    }

    function diffSignature(a, b) {
      if (!a || !b) return 999;
      let sum = 0;
      for (let i = 0; i < a.length; i++) sum += Math.abs(a[i] - b[i]);
      return sum / a.length;
    }

    function expandQuad(quad, pad) {
      if (pad <= 0) return quad;
      const cx = (quad[0].x + quad[1].x + quad[2].x + quad[3].x) / 4;
      const cy = (quad[0].y + quad[1].y + quad[2].y + quad[3].y) / 4;
      return quad.map(p => ({
        x: Math.max(0, Math.min(1, cx + (p.x - cx) * (1 + pad * 2))),
        y: Math.max(0, Math.min(1, cy + (p.y - cy) * (1 + pad * 2)))
      }));
    }

    function captureAndWarp(quad) {
      if (!cameraReady || !cvReady) return;
      playShutterSound();
      flashEffect.classList.add("active");
      setTimeout(() => flashEffect.classList.remove("active"), 150);

      const vw = video.videoWidth;
      const vh = video.videoHeight;
      const rawCanvas = document.createElement("canvas");
      rawCanvas.width = vw;
      rawCanvas.height = vh;
      rawCanvas.getContext("2d").drawImage(video, 0, 0, vw, vh);

      const targetQuad = quad ? expandQuad(quad, safetyPadding) : [
        { x: 0, y: 0 }, { x: 1, y: 0 }, { x: 1, y: 1 }, { x: 0, y: 1 }
      ];

      let src = null, dst = null, srcTri = null, dstTri = null, M = null;
      const warpedCanvas = document.createElement("canvas");

      try {
        const pts = targetQuad.map(p => ({ x: p.x * vw, y: p.y * vh }));
        const widthA = Math.hypot(pts[2].x - pts[3].x, pts[2].y - pts[3].y);
        const widthB = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
        const outW = Math.max(200, Math.round(Math.max(widthA, widthB)));

        const heightA = Math.hypot(pts[1].x - pts[2].x, pts[1].y - pts[2].y);
        const heightB = Math.hypot(pts[0].x - pts[3].x, pts[0].y - pts[3].y);
        const outH = Math.max(200, Math.round(Math.max(heightA, heightB)));

        src = cv.imread(rawCanvas);
        dst = new cv.Mat();
        srcTri = cv.matFromArray(4, 1, cv.CV_32FC2, [
          pts[0].x, pts[0].y,
          pts[1].x, pts[1].y,
          pts[2].x, pts[2].y,
          pts[3].x, pts[3].y
        ]);
        dstTri = cv.matFromArray(4, 1, cv.CV_32FC2, [
          0, 0,
          outW - 1, 0,
          outW - 1, outH - 1,
          0, outH - 1
        ]);

        M = cv.getPerspectiveTransform(srcTri, dstTri);
        cv.warpPerspective(src, dst, M, new cv.Size(outW, outH), cv.INTER_CUBIC);

        warpedCanvas.width = outW;
        warpedCanvas.height = outH;
        cv.imshow(warpedCanvas, dst);
      } catch (e) {
        warpedCanvas.width = vw;
        warpedCanvas.height = vh;
        warpedCanvas.getContext("2d").drawImage(rawCanvas, 0, 0);
      } finally {
        if (src) src.delete();
        if (dst) dst.delete();
        if (srcTri) srcTri.delete();
        if (dstTri) dstTri.delete();
        if (M) M.delete();
      }

      const fw = warpedCanvas.width;
      const fh = warpedCanvas.height;
      if (scanMode === "2p") {
        const half = Math.floor(fw / 2);
        const leftC = document.createElement("canvas");
        leftC.width = half; leftC.height = fh;
        leftC.getContext("2d").drawImage(warpedCanvas, 0, 0, half, fh, 0, 0, half, fh);

        const rightC = document.createElement("canvas");
        rightC.width = fw - half; rightC.height = fh;
        rightC.getContext("2d").drawImage(warpedCanvas, half, 0, fw - half, fh, 0, 0, fw - half, fh);

        capturedPages.push(leftC.toDataURL("image/jpeg", 0.88));
        capturedPages.push(rightC.toDataURL("image/jpeg", 0.88));
        lastBatchCount = 2;
      } else {
        capturedPages.push(warpedCanvas.toDataURL("image/jpeg", 0.88));
        lastBatchCount = 1;
      }

      updateThumb();
      showToast(`📸 원근 보정 완료! (누적 ${capturedPages.length}쪽)`);
    }

    function updateThumb() {
      pageCount.textContent = `${capturedPages.length}쪽`;
      if (capturedPages.length > 0) {
        lastThumb.src = capturedPages[capturedPages.length - 1];
        lastThumb.style.display = "block";
      } else {
        lastThumb.style.display = "none";
      }
    }

    // [영역 표시 대폭 개선] 네모가 없을 때도 안내 가이드 영역을 표시하고, 인식 시 외곽선+코너 마커를 선명하게 표시
    function drawOverlay(quad, state) {
      const { cw, ch } = syncOverlaySize();
      overlayCtx.clearRect(0, 0, cw, ch);

      if (!quad) {
        // 안내 가이드라인 표시 (책 배치 위치 기준)
        const gx = cw * 0.08;
        const gy = ch * 0.14;
        const gw = cw * 0.84;
        const gh = ch * 0.72;

        overlayCtx.save();
        overlayCtx.setLineDash([10, 8]);
        overlayCtx.lineWidth = 2;
        overlayCtx.strokeStyle = "rgba(148, 163, 184, 0.55)";
        overlayCtx.strokeRect(gx, gy, gw, gh);

        if (scanMode === "2p") {
          overlayCtx.beginPath();
          overlayCtx.moveTo(cw / 2, gy);
          overlayCtx.lineTo(cw / 2, gy + gh);
          overlayCtx.strokeStyle = "rgba(59, 130, 246, 0.45)";
          overlayCtx.stroke();
        }
        overlayCtx.restore();
        return;
      }

      const pts = quad.map(p => normToScreen(p));

      let strokeColor = "#f59e0b";
      let fillColor = "rgba(245, 158, 11, 0.14)";
      if (state === "locking") {
        strokeColor = "#10b981";
        fillColor = "rgba(16, 185, 129, 0.18)";
      } else if (state === "cooldown") {
        strokeColor = "#3b82f6";
        fillColor = "rgba(59, 130, 246, 0.15)";
      } else if (isLocked) {
        strokeColor = "#fbbf24";
        fillColor = "rgba(251, 191, 36, 0.12)";
      }

      overlayCtx.beginPath();
      overlayCtx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < 4; i++) overlayCtx.lineTo(pts[i].x, pts[i].y);
      overlayCtx.closePath();
      overlayCtx.fillStyle = fillColor;
      overlayCtx.fill();
      overlayCtx.lineWidth = 3.5;
      overlayCtx.strokeStyle = strokeColor;
      overlayCtx.stroke();

      // 2P 중앙 분할선
      if (scanMode === "2p") {
        const topM = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
        const botM = { x: (pts[3].x + pts[2].x) / 2, y: (pts[3].y + pts[2].y) / 2 };
        overlayCtx.beginPath();
        overlayCtx.setLineDash([8, 6]);
        overlayCtx.moveTo(topM.x, topM.y);
        overlayCtx.lineTo(botM.x, botM.y);
        overlayCtx.lineWidth = 2.5;
        overlayCtx.strokeStyle = "rgba(59, 130, 246, 0.95)";
        overlayCtx.stroke();
        overlayCtx.setLineDash([]);
      }

      // 4개 모서리 코너 핸들
      const r = isLocked ? 15 : 8;
      for (let i = 0; i < 4; i++) {
        overlayCtx.beginPath();
        overlayCtx.arc(pts[i].x, pts[i].y, r, 0, Math.PI * 2);
        overlayCtx.fillStyle = isLocked ? "#fbbf24" : strokeColor;
        overlayCtx.fill();
        overlayCtx.lineWidth = 2.5;
        overlayCtx.strokeStyle = "#000";
        overlayCtx.stroke();
      }
    }

    let lastTick = 0;
    function mainLoop(now) {
      requestAnimationFrame(mainLoop);
      if (now - lastTick < 90) return;
      lastTick = now;

      if (!cvReady || !cameraReady || previewModal.style.display !== "none") return;

      let activeQuad = null;
      if (isLocked) {
        activeQuad = lockedQuad;
      } else {
        const detected = detectQuadWithOpenCV();
        if (detected) {
          missedFrames = 0;
          if (!currentQuad) {
            currentQuad = detected;
          } else {
            const alpha = 0.4;
            currentQuad = currentQuad.map((p, i) => ({
              x: p.x * (1 - alpha) + detected[i].x * alpha,
              y: p.y * (1 - alpha) + detected[i].y * alpha
            }));
          }
        } else {
          missedFrames++;
          if (missedFrames > 5) currentQuad = null;
        }
        activeQuad = currentQuad;
      }

      if (!activeQuad) {
        progressFill.style.width = "0%";
        drawOverlay(null, "searching");
        setStatus("searching", "책 테두리를 맞추거나 [영역고정]을 누르세요");
        prevSig = null;
        stableStartTime = 0;
        return;
      }

      const ts = Date.now();
      if (draggingCorner !== -1) {
        drawOverlay(activeQuad, "moving");
        setStatus("moving", "모서리를 책 끝에 맞춰주세요");
        progressFill.style.width = "0%";
        return;
      }

      if (ts < cooldownUntil) {
        drawOverlay(activeQuad, "cooldown");
        setStatus("cooldown", "촬영 완료! 다음 책장을 넘겨주세요");
        progressFill.style.width = "100%";
        return;
      }

      if (!autoScanEnabled) {
        drawOverlay(activeQuad, "detected");
        progressFill.style.width = "0%";
        setStatus("searching", isLocked ? "영역 고정됨 (수동 셔터)" : "네모 인식됨 (수동 셔터)");
        return;
      }

      const { gray, sharpness } = extractInsideSignature(activeQuad);
      const motion = diffSignature(prevSig, gray);
      prevSig = gray;

      // 1단계: 움직임 감지
      if (motion > 5.0) {
        hasMovedSinceCapture = true;
        stableStartTime = 0;
        progressFill.style.width = "0%";
        drawOverlay(activeQuad, "moving");
        setStatus("moving", "책장 넘김 감지됨... 손을 치워주세요");
        return;
      }

      if (!hasMovedSinceCapture) {
        progressFill.style.width = "0%";
        drawOverlay(activeQuad, "cooldown");
        setStatus("cooldown", "책장을 넘기면 자동 촬영됩니다");
        return;
      }

      // 2단계: 정지 안정화 (0.65초)
      if (stableStartTime === 0) {
        stableStartTime = ts;
      }
      const elapsed = ts - stableStartTime;
      const progress = Math.min(1, elapsed / 650);
      progressFill.style.width = `${Math.round(progress * 100)}%`;

      if (progress < 1) {
        drawOverlay(activeQuad, "locking");
        setStatus("locking", `자동 촬영 준비 중... ${Math.round(progress * 100)}%`);
        return;
      }

      // 3단계: 직전 페이지와 유사도 비교
      if (lastCapturedSig) {
        const contentDiff = diffSignature(lastCapturedSig, gray);
        if (contentDiff < 8.5) {
          hasMovedSinceCapture = false;
          stableStartTime = 0;
          progressFill.style.width = "0%";
          drawOverlay(activeQuad, "cooldown");
          setStatus("cooldown", "같은 페이지 감지됨 (책장을 넘겨주세요)");
          return;
        }
      }

      if (sharpness < 2.5) {
        drawOverlay(activeQuad, "moving");
        setStatus("moving", "초점 맞추는 중...");
        return;
      }

      captureAndWarp(activeQuad);
      lastCapturedSig = gray;
      hasMovedSinceCapture = false;
      stableStartTime = 0;
      cooldownUntil = ts + 1300;
      drawOverlay(activeQuad, "cooldown");
    }

    function getPointerPos(e) {
      const rect = overlayCanvas.getBoundingClientRect();
      const touch = e.touches ? e.touches[0] : e;
      return { x: touch.clientX - rect.left, y: touch.clientY - rect.top };
    }

    function onPointerDown(e) {
      if (!isLocked) return;
      const pos = getPointerPos(e);
      const pts = lockedQuad.map(p => normToScreen(p));
      let bestIdx = -1, minDist = 48;
      for (let i = 0; i < 4; i++) {
        const d = Math.hypot(pts[i].x - pos.x, pts[i].y - pos.y);
        if (d < minDist) { minDist = d; bestIdx = i; }
      }
      if (bestIdx !== -1) {
        draggingCorner = bestIdx;
        e.preventDefault();
      }
    }

    function onPointerMove(e) {
      if (draggingCorner === -1 || !isLocked) return;
      const pos = getPointerPos(e);
      lockedQuad[draggingCorner] = screenToNorm(pos.x, pos.y);
      drawOverlay(lockedQuad, "moving");
      e.preventDefault();
    }

    function onPointerUp() {
      if (draggingCorner !== -1) {
        draggingCorner = -1;
        hasMovedSinceCapture = true;
        stableStartTime = 0;
      }
    }

    overlayCanvas.addEventListener("touchstart", onPointerDown, { passive: false });
    overlayCanvas.addEventListener("touchmove", onPointerMove, { passive: false });
    overlayCanvas.addEventListener("touchend", onPointerUp);
    overlayCanvas.addEventListener("mousedown", onPointerDown);
    window.addEventListener("mousemove", onPointerMove);
    window.addEventListener("mouseup", onPointerUp);

    lockBtn.addEventListener("click", () => {
      isLocked = !isLocked;
      if (isLocked) {
        if (currentQuad) {
          lockedQuad = currentQuad.map(p => ({ ...p }));
        }
        lockBtn.textContent = "🔒 고정됨";
        lockBtn.classList.add("active-amber");
        drawOverlay(lockedQuad, "detected");
        showToast("노란 꼭짓점을 손가락으로 끌어 책에 맞추세요");
      } else {
        lockBtn.textContent = "🔓 영역고정";
        lockBtn.classList.remove("active-amber");
        showToast("자동 네모 인식 모드로 복귀");
      }
      stableStartTime = 0;
    });

    autoScanBtn.addEventListener("click", () => {
      autoScanEnabled = !autoScanEnabled;
      autoScanBtn.textContent = autoScanEnabled ? "자동 ON" : "자동 OFF";
      autoScanBtn.classList.toggle("active-green", autoScanEnabled);
      stableStartTime = 0;
      progressFill.style.width = "0%";
      showToast(autoScanEnabled ? "자동 촬영 ON" : "수동 촬영 모드");
    });

    modeBtn.addEventListener("click", () => {
      scanMode = scanMode === "2p" ? "1p" : "2p";
      modeBtn.textContent = scanMode === "2p" ? "2P" : "1P";
      showToast(scanMode === "2p" ? "2P 양면 분할 모드" : "1P 단면 모드");
    });

    padBtn.addEventListener("click", () => {
      if (safetyPadding > 0) {
        safetyPadding = 0;
        padBtn.textContent = "0% OFF";
      } else {
        safetyPadding = 0.02;
        padBtn.textContent = "2% ON";
      }
      showToast(`안전 여백: ${Math.round(safetyPadding * 100)}%`);
    });

    shutterBtn.addEventListener("click", () => {
      const q = isLocked ? lockedQuad : currentQuad;
      captureAndWarp(q);
      if (q) {
        lastCapturedSig = extractInsideSignature(q).gray;
        hasMovedSinceCapture = false;
      }
      cooldownUntil = Date.now() + 1000;
    });

    thumbBox.addEventListener("click", () => {
      if (capturedPages.length === 0) {
        showToast("촬영한 사진이 없습니다.");
        return;
      }
      previewImages.innerHTML = "";
      const recent = capturedPages.slice(-lastBatchCount);
      recent.forEach((src, idx) => {
        const card = document.createElement("div");
        card.className = "preview-card";
        card.innerHTML = `<img src="${src}"><span>${capturedPages.length - recent.length + idx + 1} 페이지</span>`;
        previewImages.appendChild(card);
      });
      previewModal.style.display = "flex";
    });

    const closeModal = () => { previewModal.style.display = "none"; };
    closeModalBtn.addEventListener("click", closeModal);
    okModalBtn.addEventListener("click", closeModal);

    deleteLastBtn.addEventListener("click", () => {
      if (lastBatchCount > 0) {
        capturedPages.splice(-lastBatchCount);
        lastBatchCount = 0;
        lastCapturedSig = null;
        hasMovedSinceCapture = true;
        updateThumb();
        closeModal();
        showToast("🗑 방금 찍은 사진을 삭제했습니다.");
      }
    });

    initCamera();
  </script>
</body>
</html>
